name: Verify
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - run: go vet ./...
        working-directory: bff
      - run: test -z "$(gofmt -l .)"
        working-directory: bff
      - run: go test -race ./...
        working-directory: bff
      - run: go build ./...
        working-directory: bff
  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cosmos_sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Publication readiness (dry run only)
        run: dart pub publish --dry-run
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cosmos_sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test --platform chrome test/browser test/cache_conformance_test.dart test/client_capabilities_test.dart test/src/models_test.dart test/src/query_test.dart test/src/http_transport_test.dart test/src/authorization_test.dart test/src/identity_test.dart test/src/identity_transport_test.dart
      - run: python3 tools/browser_benchmark.py --documents=50
        working-directory: .
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
  cosmos-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/cosmos_sync
      - run: bash tools/emulator.sh test
        env:
          COSMOS_SYNC_IDENTITY_DART: '1'
  flutter-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: flutter/flutter
          ref: ee80f08bbf97172ec030b8751ceab557177a34a6 # Flutter 3.44.6
          path: .ci/flutter
          persist-credentials: false
      - name: Restore verified Flutter release metadata
        run: |
          git -C .ci/flutter fetch --depth=1 origin refs/tags/3.44.6:refs/tags/3.44.6
          test "$(git -C .ci/flutter rev-parse '3.44.6^{commit}')" = ee80f08bbf97172ec030b8751ceab557177a34a6
      - run: echo "$GITHUB_WORKSPACE/.ci/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter config --no-analytics --enable-macos-desktop
      - run: flutter pub get
        working-directory: examples/flutter_smoke
      - run: flutter analyze --fatal-infos
        working-directory: examples/flutter_smoke
      - run: flutter test integration_test/offline_sync_test.dart -d macos
        working-directory: examples/flutter_smoke
      - run: flutter pub get
        working-directory: examples/flutter_app
      - run: flutter analyze --fatal-infos
        working-directory: examples/flutter_app
      - run: flutter test
        working-directory: examples/flutter_app
      - run: python3 tools/flutter_app_smoke.py
  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/flutter_app/package-lock.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: flutter/flutter
          ref: ee80f08bbf97172ec030b8751ceab557177a34a6 # Flutter 3.44.6
          path: .ci/flutter
          persist-credentials: false
      - name: Restore verified Flutter release metadata
        run: |
          git -C .ci/flutter fetch --depth=1 origin refs/tags/3.44.6:refs/tags/3.44.6
          test "$(git -C .ci/flutter rev-parse '3.44.6^{commit}')" = ee80f08bbf97172ec030b8751ceab557177a34a6
      - run: echo "$GITHUB_WORKSPACE/.ci/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter config --no-analytics --enable-web
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/flutter_app
      - run: npm test && npm run build:auth
        working-directory: examples/flutter_app
      - run: flutter pub get
        working-directory: examples/flutter_app
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: examples/flutter_app
      - run: flutter analyze --fatal-infos
        working-directory: examples/flutter_app
      - run: flutter test
        working-directory: examples/flutter_app
      - run: flutter test --platform chrome test/browser test/auth/memory_session_test.dart test/identity_panel_test.dart
        working-directory: examples/flutter_app
      - run: flutter build web --no-pub --no-web-resources-cdn
        working-directory: examples/flutter_app
      - run: python3 tools/flutter_web_smoke.py
  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/package_docs.py --check
      - run: python3 tools/release_verify.py preflight
      - name: Validate Container Apps Terraform without Azure access
        run: bash infra/terraform/azure-container-apps/verify.sh
      - name: Validate private ACA prerequisites without Azure access
        run: bash infra/terraform/aca-validation-plan/verify.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: buildx
      - run: python3 tools/container_release_smoke.py --builder '${{ steps.buildx.outputs.name }}'
  cross-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/cosmos_sync
      - run: python3 tools/cross_stack_smoke.py
      - run: python3 tools/authorization_cross_stack_smoke.py
      - name: Verify signed directory lifecycle through native Dart and TLS
        run: go test -run '^TestDirectoryDartLifecycleCrossStack$' -count=1 -timeout=90s -v
        working-directory: bff
        env:
          COSMOS_SYNC_IDENTITY_DART: '1'
      - run: python3 tools/cache_crash_smoke.py
      - run: python3 tools/browser_cross_stack_smoke.py
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
      - run: dart run tool/benchmark.dart --documents=1000 --query-repetitions=1
        working-directory: packages/cosmos_sync
