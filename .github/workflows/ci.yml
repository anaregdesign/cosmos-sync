name: Verify
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - run: go vet ./...
        working-directory: bff
      - run: test -z "$(gofmt -l .)"
        working-directory: bff
      - run: go test -race ./...
        working-directory: bff
      - run: go build ./...
        working-directory: bff
  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cosmos_sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Publication readiness (dry run only; license decision remains pending)
        continue-on-error: true
        run: dart pub publish --dry-run
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bff
          file: bff/Dockerfile
          push: false
          tags: cosmos-sync-bff:check
  cross-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/cosmos_sync
      - run: python3 tools/cross_stack_smoke.py
