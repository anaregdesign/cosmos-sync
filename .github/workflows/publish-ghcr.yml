name: Publish private BFF container (disabled by default)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'After release approval, type publish-private-container'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: vars.GHCR_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.confirm == 'publish-private-container'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bff
          file: bff/Dockerfile
          push: true
          tags: ghcr.io/anaregdesign/cosmos-sync-bff:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/anaregdesign/cosmos-sync
